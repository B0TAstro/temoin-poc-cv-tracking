capture:
  device_index: 0
  width: 1280
  height: 720
  fps: 30
  warmup_frames: 5
  record_fourcc: mp4v

detection:
  processing_width: 640
  blur_ksize: 5
  open_ksize: 3
  close_ksize: 7
  hsv_ranges:
  - lower: [0, 0, 180]
    upper: [179, 60, 255]
  tophat_ksize: 81

quad:
  method: contour
  min_area_ratio: 0.02
  epsilon_ratio: 0.02
  min_support: 0.6
  hough:
    canny_low: 50
    canny_high: 150
    threshold: 30
    min_line_length: 30
    max_line_gap: 40
    # One band of tape gives two Canny edges plus broken pieces; segments
    # within this many pixels of the same offset are one line.
    merge_tolerance: 60
    # Segments hugging the frame edge are the frame, not the floor.
    border_margin: 8
    # Lines kept per angle family, strongest first, before searching the pairs.
    max_candidates: 4

court:
  length_cm: 2377
  doubles_width_cm: 1097
  singles_width_cm: 823
  service_line_from_net_cm: 640
  scale: 0.15
  reference_points:
  - doubles_far_left
  - doubles_far_right
  - doubles_near_right
  - doubles_near_left
  px_per_cm: 2
  grid_step_cm: 10

scoring:
  good: 0.7
  partial: 0.3

smoothing:
  corner_window: 5

visualization:
  fps_window: 30
  show_mask_on_start: false
  quad_color: [0, 255, 0]
  corner_color: [0, 255, 255]
  manual_color: [0, 140, 255]
  locked_color: [255, 150, 0]
  grid_color: [90, 90, 90]
  marker_color: [0, 0, 255]
  hud_color: [255, 255, 255]
  line_good_color: [0, 255, 0]
  line_partial_color: [0, 170, 255]
  line_missing_color: [255, 0, 255]
  candidate_color: [255, 255, 0]
